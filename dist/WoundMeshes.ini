; WoundMeshes settings - saved changes apply to the next wound, no restart needed.
[General]
; Size of each wound (1.0 = the NIF's own size)
Scale=2.0
; How far to push the wound into the body, in game units (1 unit ~ 1.4 cm).
; Raise it if wounds float above the skin, lower it if they disappear inside.
SinkDepth=3.5
MaxWoundsPerActor=10
AffectPlayer=0
SkipMelee=1

[Model]
; Which axis of the NIF points out of the skin: 0 = X, 1 = Y, 2 = Z
OutAxis=2
; 1 if it's the negative direction (-X / -Y / -Z)
OutAxisNegative=0
