name: Build WoundMeshes DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Visual Studio compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: WoundMeshes-dll
          path: |
            output/WoundMeshes.dll
            dist/WoundMeshes.ini
            build/WoundMeshes.pdb
          if-no-files-found: error
